[project]
name = "court-sentiment"
version = "2.0.0"
description = "Who is r/NBA's most hated player? Every comment of a season, classified."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "praw",
    "polars",
    "vaderSentiment",
    "jupyter",
    "python-dotenv",
    "anthropic>=0.75.0",
    "zstandard>=0.25.0",
    "boto3>=1.42.9",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
    "requests>=2.32.5",
    "dotenv>=0.9.9",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "duckdb>=1.5.4",
    "nba-api>=1.11.4",
    "pillow>=12.0.0",
    "openpyxl>=3.1.5",
    "pyarrow>=26.0.0",
]

[tool.ruff]
exclude = ["notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short -m 'not eval'"
markers = [
    "eval: live LLM classifier eval (needs ANTHROPIC_API_KEY; run: uv run pytest -m eval --maxfail=0 -rxX)",
]

[tool.uv]
dev-dependencies = [
    "pre-commit>=4.6.0",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
]
